services:

  # ============================================================
  # BAZARR — Spanish/English subtitles for Radarr and Sonarr libraries
  # Shares the scraper VPN; Gluetun publishes its UI and permits manager access.
  # ============================================================
  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls367@sha256:c1673816321156b904af9b7e6415ea547ae9622e4acc375358f1e1eb9ed1e904
    container_name: bazarr
    restart: unless-stopped
    network_mode: service:gluetun_scrapers
    depends_on:
      gluetun_scrapers:
        condition: service_healthy
        restart: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /home/devops/runtime/arrstack/bazarr:/config
      - /home/devops/runtime/arrstack/radarr/movies:/movies
      - /home/devops/runtime/arrstack/sonarr/tv:/tv
      - /home/devops/runtime/arrstack/sonarr/shows:/shows

  # ============================================================
  # GLUETUN SCRAPERS — Dedicated subtitle VPN namespace
  # Bazarr, NensaySubs and its FlareSolverr share this tunnel and loopback.
  # ============================================================
  gluetun_scrapers:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun_scrapers
    restart: unless-stopped
    ports:
      - "${BAZARR_HOST}:6767:6767"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /home/devops/runtime/arrstack/gluetun-scrapers:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${SCRAPER_VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${SCRAPER_VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${SCRAPER_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${SCRAPER_WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${SCRAPER_SERVER_COUNTRIES}
      - TZ=${TZ}
      # Local manager exceptions apply to all consumers of this VPN namespace.
      - FIREWALL_OUTBOUND_SUBNETS=172.18.0.4/32,172.18.0.5/32
      - FIREWALL_INPUT_PORTS=6767
      # - DNS_UPSTREAM_RESOLVER_TYPE=plain
      # - DNS_UPSTREAM_PLAIN_ADDRESSES=1.1.1.1:53,8.8.8.8:53
    networks:
      arrnetwork:
        ipv4_address: 172.18.0.10

  # ============================================================
  # FLARESOLVERR SUBS — Subtitle browser challenge solver
  # Shares the scraper VPN namespace with NensaySubs.
  # ============================================================
  flaresolverr_subs:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr_subs
    restart: unless-stopped

    network_mode: service:gluetun_scrapers

    depends_on:
      gluetun_scrapers:
        condition: service_healthy
        restart: true

    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}

  # ============================================================
  # NENSAYSUBS — Manually operated subtitle acquisition and placement
  # Shares the scraper VPN and reaches its solver over loopback; writes media.
  # ============================================================
  nensaysubs:
    image: nensaysubs:latest
    container_name: nensaysubs
    restart: "no"
    stdin_open: true
    tty: true
    depends_on:
      gluetun_scrapers:
        condition: service_healthy
        restart: true
      flaresolverr_subs:
        condition: service_started
    network_mode: service:gluetun_scrapers
    environment:
      - TZ=${TZ}
      - NENSAYSUBS_OUTPUT_DIR=/data/media/subs
      - NENSAYSUBS_EPISODE_BASE_DIR=/data/media
      - NENSAYSUBS_FLARESOLVERR_URL=http://127.0.0.1:8191/v1
      - NENSAYSUBS_INTERACTIVE=true
    volumes:
      - /home/devops/runtime/arrstack/nensaysubs:/runtime
      - /data/media:/data/media

  # ============================================================
  # FFSUBSYNC — On-demand subtitle alignment tool
  # Host workflow invokes one-off runs; writes media without network access.
  # ============================================================
  ffsubsync:
    image: ffsubsync:latest
    restart: "no"
    network_mode: none
    container_name: ffsubsync
    volumes:
      - /data/media:/data/media
    stdin_open: true
    tty: true

networks:
  arrnetwork:
    external: true
    name: arrnet_managed
