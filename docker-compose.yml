  #       ipv4_address: 172.18.0.2


  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.1ubu2604-ls50
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "${JELLYFIN_HOST}:8096:8096"
      - "${JELLYFIN_LOCAL_HOST}:8096:8096"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${GID_VIDEO:-44}"
      - "${GID_RENDER:-993}"
    volumes:
      - /home/devops/runtime/jellysun/config:/config
      - /home/devops/runtime/jellysun/data/cache:/config/cache
      - /home/devops/runtime/jellysun/data/transcode:/config/data/transcode
      - /home/devops/runtime/jellysun/data/metadata:/config/data/metadata

      # Same media as PROD, but physically read-only to this container.
      - /data/media:/data/media:ro

      #PLUGINS
      - /home/devops/infra/jellysun-ui/dist/file-transformation/Jellyfin.Plugin.FileTransformation.dll:/config/data/plugins/FileTransformation/Jellyfin.Plugin.FileTransformation.dll:ro
      - /home/devops/infra/jellysun-ui/dist/jellysun-web-integration/Jellyfin.Plugin.Jellysun.WebIntegration.dll:/config/data/plugins/Jellysun.WebIntegration/Jellyfin.Plugin.Jellysun.WebIntegration.dll:ro

    networks:
      arrnetwork:
        ipv4_address: 172.18.0.2



  # ============================================================
  # GLUETUN — VPN Container (kill switch + tunnel)
  # All VPN-protected services route through this container.
  # Ports for those services are mapped HERE, not on the services.
  # ============================================================
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    restart: unless-stopped
    ports:
      - "${GLUETUN_HOST}:8081:8080"   # qBittorrent WebUI
      - "${GLUETUN_HOST}:9696:9696"   # Prowlarr WebUI
      - "${GLUETUN_HOST}:7681:7681"   # cli API (for themearr)
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /home/devops/runtime/arrstack/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - TZ=${TZ}
      # - FIREWALL_OUTBOUND_SUBNETS=172.21.0.0/16,10.10.0.0/24
      # - DNS_UPSTREAM_RESOLVER_TYPE=plain
      # - DNS_UPSTREAM_PLAIN_ADDRESSES=1.1.1.1:53,8.8.8.8:53
    networks:
      arrnetwork:
        ipv4_address: 172.18.0.3

  # ============================================================
  # GLUETUN SCRAPERS
  # VPN independiente para NensaySubs y herramientas
  # sensibles a geolocalización.
  # ============================================================
  gluetun_scrapers:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun_scrapers
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /home/devops/runtime/arrstack/gluetun-scrapers:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=${SCRAPER_VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${SCRAPER_VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${SCRAPER_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${SCRAPER_WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${SCRAPER_SERVER_COUNTRIES}
      - TZ=${TZ}
      # - FIREWALL_OUTBOUND_SUBNETS=172.21.0.0/16,10.10.0.0/24
      # - DNS_UPSTREAM_RESOLVER_TYPE=plain
      # - DNS_UPSTREAM_PLAIN_ADDRESSES=1.1.1.1:53,8.8.8.8:53
    networks:
      arrnetwork:
        ipv4_address: 172.18.0.10

  # ============================================================
  # QBITTORRENT — Torrent Client (runs through Gluetun VPN)
  # ALL traffic goes through the VPN tunnel. No direct internet.
  # ============================================================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    labels:
      - deunhealth.restart.on.unhealthy=true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT_INTERNAL:-8080}
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
    volumes:
      - /home/devops/runtime/arrstack/qbittorrent:/config
      - /data/fast/qbittorrent:/data
      - /home/devops/runtime/arrstack/qbittorrent/temp:/temp
      - /home/devops/runtime/arrstack/qbittorrent/watch:/watch
    
  # ============================================================
  # DEUNHEALTH — Auto-restarts unhealthy containers
  # If qBittorrent loses VPN, this restarts it automatically.
  # ============================================================
  deunhealth:
    image: qmcgaw/deunhealth
    container_name: deunhealth
    restart: always
    network_mode: none
    environment:
      - LOG_LEVEL=info
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # ============================================================
  # PROWLARR — Indexer Manager (runs through Gluetun VPN)
  # Manages torrent indexers. Syncs to Radarr/Sonarr.
  # ============================================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls161
    container_name: prowlarr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /home/devops/runtime/arrstack/prowlarr:/config

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}

  flaresolverr_subs:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr_subs
    restart: unless-stopped

    network_mode: service:gluetun_scrapers

    depends_on:
      gluetun_scrapers:
        condition: service_healthy
        restart: true

    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}

  # ============================================================
  # RADARR — Movie Manager (NOT behind VPN)
  # Searches via Prowlarr, sends downloads to qBittorrent,
  # renames and organizes completed movies to media folder.
  # ============================================================
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls317
    container_name: radarr
    restart: unless-stopped
    ports:
      - "${RADARR_HOST}:7878:7878"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /home/devops/runtime/arrstack/radarr:/config
      - /home/devops/runtime/arrstack/radarr/movies:/movies
      - /home/devops/runtime/arrstack/radarr/downloads:/data/downloads
    networks:
      arrnetwork:
        ipv4_address: 172.18.0.4

  # ============================================================
  # SONARR — TV Show Manager (NOT behind VPN)
  # Same pattern as Radarr but for TV series.
  # ============================================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls325
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "${SONARR_HOST}:8989:8989"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /home/devops/runtime/arrstack/sonarr:/config
      - /home/devops/runtime/arrstack/sonarr/tv:/tv
      - /home/devops/runtime/arrstack/sonarr/shows:/shows
      - /home/devops/runtime/arrstack/sonarr/downloads:/data/downloads
    networks:
      arrnetwork:
        ipv4_address: 172.18.0.5
        

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: jellyseerr
    restart: unless-stopped
    ports:
      - "${JELLYSEERR_HOST}:5055:5055"
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /home/devops/runtime/arrstack/jellyseerr:/app/config
    networks:
      arrnetwork:
        ipv4_address: 172.18.0.7

  navidrome:
    image: deluan/navidrome:0.64.0
    container_name: navidrome
    user: "${PUID}:${PGID}"
    restart: unless-stopped
    ports:
      - "${NAVIDROME_HOST}:4533:4533"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - ND_MUSICFOLDER=/music
      - ND_DATAFOLDER=/data
      - ND_LOGLEVEL=info
      - ND_PORT=4533
      - ND_ADDRESS=0.0.0.0
      - ND_SCANNER_SCHEDULE=1h
      - ND_SCANNER_WATCHERWAIT=1m
      - ND_ENABLETRANSCODINGCONFIG=true
      - ND_DEFAULTTHEME=Dark
      - ND_ENABLESHARING=true
      - ND_ENABLEDOWNLOADS=true
      - ND_FFMPEGPATH=/usr/bin/ffmpeg
      - ND_TRANSCODINGCACHESIZE=500MB
      - ND_DEFAULTDOWNSAMPLINGFORMAT=opus
      - ND_ENABLEARTWORKPRECACHE=true
      - ND_COVERARTQUALITY=85
      - ND_ENABLEEXTERNALSERVICES=true
      - ND_ENABLELOGREDACTING=true
      - ND_SESSIONTIMEOUT=72h
      - ND_PROMETHEUS_ENABLED=true
      - ND_PROMETHEUS_METRICSPATH=/metrics
      - ND_ENABLEUSEREDITING=false
      - ND_EXTAUTH_TRUSTEDSOURCES=${ND_EXTAUTH_TRUSTEDSOURCES:-10.10.0.1/32}
      - ND_EXTAUTH_USERHEADER=Remote-User
    volumes:
      - "/home/devops/runtime/arrstack/navidrome:/data"
      - "/home/devops/infra/arrstack/navidrome/music:/music:ro"
    networks:
      arrnetwork:
        ipv4_address: 172.18.0.8

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    ports:
      - "${LIDARR_HOST}:8686:8686"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - /home/devops/runtime/arrstack/lidarr:/config
      - /home/devops/runtime/arrstack/lidarr/music:/music
      - /home/devops/runtime/arrstack/lidarr/downloads:/downloads
    networks:
      arrnetwork:
        ipv4_address: 172.18.0.9

  ytdlp:
    image: ytdlp:latest
    container_name: ytdlp
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    volumes:
      - /home/devops/runtime/arrstack/ytdlp/music:/music
      - /home/devops/runtime/arrstack/ytdlp/downloads:/downloads
      - /home/devops/infra/arrstack/yt-dlp/cookies.txt:/cookies.txt
    stdin_open: true
    tty: true
    entrypoint: ["sh", "-c"]
    command: "tail -f /dev/null"
    restart: unless-stopped

  themearr:
    image: themearr:latest
    container_name: themearr
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      - TZ=${TZ}
      - ANIMETHEMES_OUTPUT_DIR=/data/anime
      - ANIMETHEMES_API_URL=${ANIMETHEMES_API_URL:-http://api.animethemes.moe}
    volumes:
      - /home/devops/runtime/arrstack/themearr/AnimeThemes:/data/anime

  nensaysubs:
    image: nensaysubs:latest
    container_name: nensaysubs
    restart: "no"
    stdin_open: true
    tty: true
    depends_on:
      gluetun_scrapers:
        condition: service_healthy
        restart: true
      flaresolverr_subs:
        condition: service_started
    network_mode: service:gluetun_scrapers
    environment:
      - TZ=${TZ}
      - NENSAYSUBS_OUTPUT_DIR=/data/media/subs
      - NENSAYSUBS_EPISODE_BASE_DIR=/data/media
      - NENSAYSUBS_FLARESOLVERR_URL=http://127.0.0.1:8191/v1
      - NENSAYSUBS_INTERACTIVE=true
    volumes:
      - /home/devops/runtime/arrstack/nensaysubs:/runtime
      - /data/media:/data/media

  ffsubsync:
    image: ffsubsync:latest
    restart: "no"
    network_mode: none
    container_name: ffsubsync
    volumes:
      - /data/media:/data/media
    stdin_open: true
    tty: true

  makemkv:
    image: makemkv:latest
    container_name: makemkv
    restart: "no"
    network_mode: none
    environment:
      - HOME=/config
    volumes:
      - /home/devops/runtime/arrstack/makemkv:/config
      - /data/fast/qbittorrent/downloads:/downloads

networks:
  default:
    name: arrnet_managed

  arrnetwork:
    name: arrnet_managed
    ipam:
      config:
        - subnet: 172.18.0.0/16
