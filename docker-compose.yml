  #     - /home/devops/infra/dessun-jellyfin-ui/dist/Jellyfin.Plugin.Jellysun.WebIntegration.dll:/config/data/plugins/JellysunWebIntegration/Jellyfin.Plugin.Jellysun.WebIntegration.dll:ro

  #     - /data/media:/data/media
